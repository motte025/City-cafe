<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>City Cafe · Fernbedienung</title>
<!--
    SAMMEL-FERNBEDIENUNG

    Eine Adresse fuer alles: YouTube-Videos, DJ-Livestream und das Trinkspiel.
    Die drei bestehenden Seiten bleiben, wie sie sind, und laufen hier in einem
    Rahmen - so gibt es keine doppelte Logik.

    Der Screen wird EINMAL hier bestimmt (gleiche oeffentliche IP = gleiches
    Netz = die Box vor Ort, siehe yt-fernbedienung-net.js) und dann als
    ?raum=... an die Unterseiten weitergereicht.
-->
<style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { height: 100%; }
    body {
        margin: 0; background: #0b1020; color: #f2f5ff; display: flex; flex-direction: column;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; font-size: 30px;
        -webkit-text-size-adjust: 100%;
    }
    header {
        padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px;
        background: #0f1630; border-bottom: 1px solid #27325c; flex-shrink: 0;
    }
    .zeile { display: flex; gap: 10px; }
    .zeile + .zeile { margin-top: 10px; }
    button {
        font: inherit; font-size: 27px; font-weight: 700; border: 0; border-radius: 14px;
        padding: 16px 10px; background: #1d2647; color: #cdd7f5; cursor: pointer; flex: 1;
    }
    button.aktiv { background: #2f6bff; color: #fff; }
    .screen { font-size: 21px; color: #8ea0c8; padding: 8px 2px 0; text-align: center; }
    iframe { flex: 1; width: 100%; border: 0; background: #0b1020; }
    .hinweis {
        flex: 1; display: flex; flex-direction: column; justify-content: center;
        text-align: center; padding: 24px; color: #8ea0c8; line-height: 1.5;
    }
</style>
</head>
<body>

<header>
    <div class="zeile" id="tabs"></div>
    <div class="zeile" id="boxen"></div>
    <div class="screen" id="screen">Screen wird gesucht …</div>
</header>
<div id="hinweis" class="hinweis" hidden>
    Der Screen meldet gerade keine Hos’n-Obe-Runde.<br>
    Sobald das Kartenspiel am Screen läuft, öffnet es sich hier von selbst.
</div>
<iframe id="rahmen" title="Fernbedienung"></iframe>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="dj-fernbedienung-config.js"></script>
<script src="dj-fernbedienung-net.js"></script>
<script src="yt-fernbedienung-net.js"></script>
<script>
(function () {
    'use strict';

    var CFG = window.DJ_REMOTE_CONFIG || {};
    var FASSUNG = '2026-09-21c';
    var el = function (id) { return document.getElementById(id); };
    var abfrage = new URLSearchParams(location.search);

    var SEITEN = [
        { schluessel: 'yt', text: '🎬 Videos', datei: 'yt-fernbedienung.html', raumParameter: true },
        { schluessel: 'dj', text: '🎧 DJ', datei: 'dj-fernbedienung.html', raumParameter: true },
        // Das Kartenspiel braucht die Kennung der laufenden Runde - dieselbe,
        // die sonst im QR-Code am Screen steht. Der Screen meldet sie im Status
        // mit, hier wird sie als ?session=... angehaengt.
        { schluessel: 'spiel', text: '🃏 Hos’n Obe', datei: 'hosn-obe.html', raumParameter: false,
          brauchtSpiel: true }
    ];

    var spielSession = '';      // laufende Hos'n-Obe-Runde des gewaehlten Screens

    var raum = (abfrage.get('raum') || '').trim()
        || (function () { try { return localStorage.getItem('fbRaum') || ''; } catch (e) { return ''; } })()
        || CFG.raum || 'city-cafe';
    var raumFest = !!(abfrage.get('raum') || '').trim();
    var verbindung = null;
    var aktiv = (abfrage.get('teil') || '').trim() || 'yt';

    // Merkt sich je Reiter, was zuletzt geladen wurde. Ohne das wuerde jeder
    // Status vom Screen den Rahmen neu laden (der Zeitstempel gegen den Cache
    // ist ja jedes Mal ein anderer) - man haette staendig eine leere Seite.
    var geladen = {};

    function rahmenSetzen() {
        var seite = SEITEN.filter(function (s) { return s.schluessel === aktiv; })[0] || SEITEN[0];
        [].forEach.call(el('tabs').children, function (k) {
            k.className = k.dataset.teil === aktiv ? 'aktiv' : '';
        });
        try { localStorage.setItem('fbTeil', aktiv); } catch (e) {}

        if (seite.brauchtSpiel && !spielSession) {
            el('hinweis').hidden = false;
            el('rahmen').hidden = true;
            return;
        }
        el('hinweis').hidden = true;
        el('rahmen').hidden = false;

        var kennung = seite.schluessel + '|' + raum + '|' + (seite.brauchtSpiel ? spielSession : '');
        if (geladen[seite.schluessel] === kennung) return;
        geladen = {};                       // nur der sichtbare Rahmen zaehlt
        geladen[seite.schluessel] = kennung;
        var ziel = seite.datei + '?v=' + Date.now()
            + (seite.raumParameter ? '&raum=' + encodeURIComponent(raum) : '')
            + (seite.brauchtSpiel ? '&session=' + encodeURIComponent(spielSession) : '');
        el('rahmen').setAttribute('src', ziel);
    }

    // Kommt eine neue Spielkennung herein, waehrend das Kartenspiel offen ist,
    // laedt es sich damit von selbst.
    function spielSessionSetzen(neu) {
        neu = String(neu || '');
        if (neu === spielSession) return;
        spielSession = neu;
        if (aktiv === 'spiel') rahmenSetzen();
    }

    SEITEN.forEach(function (s) {
        var k = document.createElement('button');
        k.type = 'button';
        k.textContent = s.text;
        k.dataset.teil = s.schluessel;
        k.addEventListener('click', function () { aktiv = s.schluessel; rahmenSetzen(); });
        el('tabs').appendChild(k);
    });
    rahmenSetzen();

    // --- Screen bestimmen ---------------------------------------------------
    function screenText(name, zusatz) {
        el('screen').textContent = 'Screen: ' + name + (zusatz ? ' · ' + zusatz : '')
            + ' · Fassung ' + FASSUNG;
    }
    screenText(raum, '');

    function boxenKnoepfe(boxen) {
        var box = el('boxen');
        box.innerHTML = '';
        if (boxen.length < 2) return;
        boxen.forEach(function (b) {
            var k = document.createElement('button');
            k.type = 'button';
            k.textContent = b.name;
            k.className = b.raum === raum ? 'aktiv' : '';
            k.addEventListener('click', function () {
                raum = b.raum;
                try { localStorage.setItem('fbRaum', raum); } catch (e) {}
                screenText(b.name, 'von Hand gewählt');
                boxenKnoepfe(boxen);
                if (verbindung) statusAbo(verbindung);
                rahmenSetzen();
            });
            box.appendChild(k);
        });
    }

    // Status des gewaehlten Screens mithoeren - daraus kommt die Spielkennung.
    var statusAus = null;
    function statusAbo(verb) {
        if (statusAus) { try { statusAus(); } catch (e) {} statusAus = null; }
        spielSessionSetzen('');
        statusAus = YT_REMOTE_NET.aufStatusHoeren(verb, raum, function (s) {
            spielSessionSetzen(s && s.spiel);
        });
    }

    if (window.YT_REMOTE_NET && YT_REMOTE_NET.istEingerichtet()) {
        YT_REMOTE_NET.bereit().then(function (verb) {
            if (!verb) { screenText(raum, 'keine Verbindung'); return; }
            verbindung = verb;
            statusAbo(verb);
            Promise.all([
                YT_REMOTE_NET.boxenLesen(verb),
                fetch('https://api.ipify.org?format=json', { cache: 'no-store' })
                    .then(function (r) { return r.json(); }).then(function (d) { return d.ip; })
                    .catch(function () { return ''; })
            ]).then(function (erg) {
                var boxen = erg[0], meineIp = erg[1];
                var passend = meineIp ? boxen.filter(function (b) { return b.ip && b.ip === meineIp; }) : [];
                if (!raumFest && passend.length === 1 && passend[0].raum !== raum) {
                    raum = passend[0].raum;
                    try { localStorage.setItem('fbRaum', raum); } catch (e) {}
                    screenText(passend[0].name, 'im selben Netz erkannt');
                    statusAbo(verb);
                    rahmenSetzen();
                } else {
                    var eigene = boxen.filter(function (b) { return b.raum === raum; })[0];
                    screenText(eigene ? eigene.name : raum, passend.length ? 'im selben Netz' : '');
                }
                boxenKnoepfe(boxen);
            });
        });
    }
})();
</script>
</body>
</html>
