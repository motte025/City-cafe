<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#060e1c">
<title>Kartentausch · City Cafe Klagenfurt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body { height: 100%; }

    /* Ganzer Bildschirm im Hochformat: die Seite scrollt nicht, sondern teilt
       die verfuegbare Hoehe auf Hand, Mitte, Status und Aktionen auf. Die Hand
       bekommt den groessten Anteil, damit die Karten so gross wie moeglich sind. */
    body {
        margin: 0;
        height: 100dvh;
        min-height: 100vh;
        background: linear-gradient(180deg, #0b1526 0%, #060e1c 55%, #040914 100%);
        color: #f8fafc;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: calc(env(safe-area-inset-top) + 6px) 6px calc(env(safe-area-inset-bottom) + 8px);
        overflow: hidden;
    }

    .kt-head {
        flex: 0 0 auto;
        display: flex; align-items: center; justify-content: space-between;
        gap: 10px; padding: 2px 4px;
    }
    .kt-brand {
        font-family: 'Orbitron', sans-serif; font-weight: 900;
        font-size: 15px; letter-spacing: 1.2px; color: #00f2fe;
        text-shadow: 0 0 14px rgba(0,242,254,0.45);
    }
    .kt-seat-badge {
        font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 15px;
        padding: 6px 13px; border-radius: 999px;
        background: rgba(0,242,254,0.12); border: 1px solid rgba(0,242,254,0.45);
        color: #00f2fe; white-space: nowrap;
    }

    /* Eigene Hand bewusst GANZ OBEN: so laesst sich das Display mit einer Hand
       abschirmen oder wegkippen, ohne dass Nachbarn mitlesen. */
    .kt-hand-panel {
        flex: 0 0 auto;
        background: rgba(10,20,38,0.82);
        border: 1px solid rgba(0,242,254,0.28);
        border-radius: 20px;
        padding: 10px 6px 12px;
        box-shadow: 0 14px 40px rgba(0,0,0,0.55), inset 0 1px 1px rgba(255,255,255,0.09);
    }
    .kt-panel-label {
        font-size: 12px; font-weight: 800; text-transform: uppercase;
        letter-spacing: 1.4px; color: #94a3b8; margin-bottom: 8px; text-align: center;
    }
    .kt-privacy-hint {
        font-size: 12px; color: #64748b; text-align: center; margin-top: 8px;
    }

    .kt-cards { display: flex; justify-content: center; align-items: flex-start; gap: 6px; }

    /* flex:1 statt fester Breite - dadurch nutzen die Karten auf Handy UND
       Tablet die volle Zeilenbreite. Die vh-Grenze verhindert nur, dass sie auf
       sehr hohen Displays absurd gross werden. */
    .kt-card {
        position: relative;
        flex: 1 1 0;
        min-width: 0;
        max-width: 32vh;
        aspect-ratio: 2 / 3;
        border-radius: 12px; overflow: hidden;
        border: 3px solid transparent;
        background: #0a1426;
        transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .kt-middle-panel .kt-card { max-width: 26vh; }

    .kt-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .kt-card.is-pickable { cursor: pointer; border-color: rgba(0,242,254,0.35); }
    .kt-card.is-selected {
        border-color: #00f2fe;
        box-shadow: 0 0 0 4px rgba(0,242,254,0.28), 0 0 26px rgba(0,242,254,0.6);
        transform: translateY(-9px);
    }
    .kt-card.is-middle.is-selected { border-color: #f355da; box-shadow: 0 0 0 4px rgba(243,85,218,0.28), 0 0 26px rgba(243,85,218,0.6); }

    .kt-score-line {
        text-align: center; margin-top: 9px;
        font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 26px;
        color: #f8fafc;
    }
    .kt-score-line .kt-score-suit { color: #00f2fe; font-size: 19px; }
    .kt-score-line.is-fire { color: #ff8a3d; text-shadow: 0 0 18px rgba(255,138,61,0.6); }

    .kt-middle-panel {
        flex: 0 0 auto;
        background: rgba(10,20,38,0.62);
        border: 1px solid rgba(255,255,255,0.14);
        border-radius: 20px; padding: 10px 6px;
    }

    /* Nimmt den Rest der Hoehe auf und scrollt nur im Notfall (lange Aufdeck-Liste). */
    .kt-status {
        flex: 1 1 auto; min-height: 0; overflow-y: auto;
        text-align: center;
        background: rgba(10,20,38,0.62);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 16px; padding: 12px 12px;
    }
    .kt-status-main { font-weight: 800; font-size: 18px; }
    .kt-status-sub { font-size: 14px; color: #94a3b8; margin-top: 5px; line-height: 1.45; }
    .kt-status.is-myturn { border-color: rgba(0,242,254,0.5); background: rgba(0,242,254,0.09); }
    .kt-status.is-myturn .kt-status-main { color: #00f2fe; }
    .kt-status.is-error { border-color: rgba(255,51,68,0.5); background: rgba(255,51,68,0.1); }

    .kt-actions { flex: 0 0 auto; display: flex; flex-direction: column; gap: 8px; }
    .kt-btn {
        width: 100%; padding: 18px 14px; border-radius: 15px;
        font-family: 'Plus Jakarta Sans', sans-serif; font-size: 19px; font-weight: 800;
        border: 1px solid rgba(0,242,254,0.45);
        background: rgba(0,242,254,0.12); color: #e6fbff;
        transition: transform 0.12s ease, opacity 0.15s ease;
    }
    .kt-btn:active { transform: scale(0.975); }
    .kt-btn[disabled] { opacity: 0.32; }
    .kt-btn.kt-btn-knock { border-color: rgba(255,51,68,0.55); background: rgba(255,51,68,0.14); color: #ffd9dd; }
    .kt-btn.kt-btn-confirm { border-color: rgba(46,204,113,0.6); background: rgba(46,204,113,0.16); color: #d8ffe9; }
    .kt-btn.kt-btn-ghost { border-color: rgba(255,255,255,0.22); background: rgba(255,255,255,0.06); color: #cbd5e1; }
    .kt-btn.kt-btn-bot { border-color: rgba(244,163,0,0.55); background: rgba(244,163,0,0.14); color: #ffe4b3; }

    .kt-seat-grid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 11px; }
    .kt-seat-pill {
        font-size: 14px; font-weight: 700; padding: 8px 14px; border-radius: 999px;
        border: 1px solid rgba(255,255,255,0.16); background: rgba(255,255,255,0.05); color: #94a3b8;
    }
    .kt-seat-pill.is-taken { border-color: rgba(46,204,113,0.5); color: #6ee7a8; background: rgba(46,204,113,0.1); }
    .kt-seat-pill.is-me { border-color: #00f2fe; color: #00f2fe; background: rgba(0,242,254,0.14); }

    /* Host-Auswahl: bewusst grossflaechig, das ist der erste Kontakt mit dem Spiel. */
    .kt-count-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .kt-count-btn {
        flex: 1 1 30%; min-width: 96px; padding: 26px 8px; border-radius: 18px;
        font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 44px;
        border: 2px solid rgba(0,242,254,0.45); background: rgba(0,242,254,0.12); color: #e6fbff;
    }
    .kt-count-btn:active { transform: scale(0.96); }
    .kt-count-caption {
        font-size: 14px; font-weight: 700; color: #94a3b8;
        text-align: center; margin-bottom: 10px;
    }

    .kt-reveal-row {
        display: flex; align-items: center; gap: 10px;
        padding: 9px 11px; border-radius: 13px; margin-top: 8px;
        border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04);
    }
    .kt-reveal-row.is-paying { border-color: #ff3344; background: rgba(255,51,68,0.14); }
    .kt-reveal-row.is-fire { border-color: #ff8a3d; background: rgba(255,138,61,0.14); }
    .kt-reveal-name { font-weight: 800; font-size: 14px; min-width: 78px; text-align: left; }
    .kt-reveal-cards { display: flex; gap: 4px; flex: 1; justify-content: center; }
    .kt-reveal-cards img { width: 38px; border-radius: 5px; display: block; }
    .kt-reveal-score { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 19px; }

    .kt-hidden { display: none !important; }
</style>
</head>
<body>

<div class="kt-head">
    <div class="kt-brand">CITY CAFE · KARTENTAUSCH</div>
    <div class="kt-seat-badge kt-hidden" id="kt-seat-badge">—</div>
</div>

<!-- Eigene Hand ganz oben im Viewport (Sichtschutz beim Halten des Handys) -->
<div class="kt-hand-panel kt-hidden" id="kt-hand-panel">
    <div class="kt-panel-label">Deine Karten — nicht herzeigen</div>
    <div class="kt-cards" id="kt-hand-cards"></div>
    <div class="kt-score-line" id="kt-hand-score"></div>
    <div class="kt-privacy-hint">Nur du siehst diese Karten. Am TV liegen sie verdeckt.</div>
</div>

<div class="kt-middle-panel kt-hidden" id="kt-middle-panel">
    <div class="kt-panel-label">Offene Mitte</div>
    <div class="kt-cards" id="kt-middle-cards"></div>
</div>

<div class="kt-status" id="kt-status">
    <div class="kt-status-main" id="kt-status-main">Verbinde…</div>
    <div class="kt-status-sub" id="kt-status-sub">Einen Moment.</div>
    <div id="kt-status-extra"></div>
</div>

<div class="kt-actions" id="kt-actions"></div>

<script src="kartentausch-config.js"></script>
<script src="kartentausch-engine.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="kartentausch-net.js"></script>
<script>
(function () {
    'use strict';

    var CFG = window.KARTENTAUSCH_CONFIG || {};
    var E = window.KartentauschEngine;

    var els = {
        seatBadge: document.getElementById('kt-seat-badge'),
        handPanel: document.getElementById('kt-hand-panel'),
        handCards: document.getElementById('kt-hand-cards'),
        handScore: document.getElementById('kt-hand-score'),
        middlePanel: document.getElementById('kt-middle-panel'),
        middleCards: document.getElementById('kt-middle-cards'),
        status: document.getElementById('kt-status'),
        statusMain: document.getElementById('kt-status-main'),
        statusSub: document.getElementById('kt-status-sub'),
        statusExtra: document.getElementById('kt-status-extra'),
        actions: document.getElementById('kt-actions')
    };

    var sessionId = new URLSearchParams(location.search).get('session') || '';
    var db = null;
    var uid = null;
    var mySeat = -1;
    var isHost = false;
    var myHand = [];
    var pub = {};
    var pickedHand = null;
    var pickedMiddle = null;
    var busy = false;

    function setStatus(main, sub, cls) {
        els.statusMain.textContent = main;
        els.statusSub.textContent = sub || '';
        els.status.className = 'kt-status' + (cls ? ' ' + cls : '');
    }

    function show(el, visible) { el.classList.toggle('kt-hidden', !visible); }

    function seatName(seat) { return 'Spieler ' + (Number(seat) + 1); }

    function cardImg(code) {
        var img = document.createElement('img');
        img.src = E.cardImage(code, 'cards/');
        img.alt = E.cardLabel(code);
        return img;
    }

    function renderCards(container, codes, opts) {
        container.innerHTML = '';
        (codes || []).forEach(function (code, index) {
            var card = document.createElement('div');
            card.className = 'kt-card' + (opts.middle ? ' is-middle' : '');
            card.appendChild(cardImg(code));
            if (opts.pickable) {
                card.classList.add('is-pickable');
                if (opts.selected === index) card.classList.add('is-selected');
                card.addEventListener('click', function () { opts.onPick(index); });
            }
            container.appendChild(card);
        });
    }

    function renderHandScore() {
        if (!myHand.length) { els.handScore.textContent = ''; return; }
        var r = E.scoreHand(myHand);
        els.handScore.className = 'kt-score-line' + (r.fire ? ' is-fire' : '');
        var suffix = r.fire ? ' 🔥 FEUER'
            : r.threeOfAKind ? ' <span class="kt-score-suit">Drilling</span>'
            : r.suit ? ' <span class="kt-score-suit">' + E.SUIT_SYMBOL[r.suit] + '</span>' : '';
        els.handScore.innerHTML = r.score + suffix;
    }

    function button(label, cls, onClick, disabled) {
        var b = document.createElement('button');
        b.className = 'kt-btn' + (cls ? ' ' + cls : '');
        b.textContent = label;
        if (disabled) b.disabled = true;
        else b.addEventListener('click', onClick);
        return b;
    }

    // ---------- Züge ----------

    function isMyTurn() {
        return pub.phase && (pub.phase === 'playing' || pub.phase === 'knocked') &&
               Number(pub.currentTurnSeat) === mySeat && myHand.length === 3;
    }

    // Geklopft werden darf erst, wenn jeder einmal am Zug war - also ab der
    // zweiten Runde. Davor waere die Runde vorbei, bevor sie begonnen hat.
    function canKnockNow() {
        if (pub.knockedBySeat !== null && pub.knockedBySeat !== undefined) return false;
        var count = Number(pub.playerCount) || 2;
        return (Number(pub.turnsPlayed) || 0) >= count;
    }

    function knockRoundsLeft() {
        var count = Number(pub.playerCount) || 2;
        return Math.max(0, count - (Number(pub.turnsPlayed) || 0));
    }

    // Gemeinsamer Abschluss jedes Zuges: Mitte + nächster Sitz + ggf. Schluss-Countdown.
    function commitTurn(newMiddle, move) {
        var count = Number(pub.playerCount) || 2;
        var updates = {
            middleCards: newMiddle,
            currentTurnSeat: E.nextSeat(mySeat, count),
            lastMove: move,
            turnsPlayed: (Number(pub.turnsPlayed) || 0) + 1,
            turnStartedAt: firebase.database.ServerValue.TIMESTAMP
        };

        if (move.type === 'knock') {
            updates.knockedBySeat = mySeat;
            updates.finalTurnsRemaining = count - 1;
            updates.phase = 'knocked';
        } else if (pub.knockedBySeat !== null && pub.knockedBySeat !== undefined) {
            var left = (Number(pub.finalTurnsRemaining) || 0) - 1;
            updates.finalTurnsRemaining = left;
            if (left <= 0) updates.phase = 'reveal';
        }

        return KtNet.publicRef(db, sessionId).update(updates);
    }

    function writeHand(hand) {
        myHand = hand;
        renderHandScore();
        return KtNet.privateRef(db, sessionId, mySeat).set({ hand: hand });
    }

    /*
     * Schrittweises Aufdecken: Wer klopft, legt seine Karten sofort offen hin.
     * Jeder danach spielt noch einen Zug und deckt dann ebenfalls auf. Am Ende
     * liegen alle Haende offen - der TV zeigt jede Hand in dem Moment, in dem
     * sie veroeffentlicht wird.
     */
    function publishMyHand(hand) {
        if (mySeat < 0) return Promise.resolve();
        var cards = hand || myHand;
        if (!cards || cards.length !== 3) return Promise.resolve();
        return KtNet.publicRef(db, sessionId, 'revealedHands/' + mySeat).set(cards)
            .catch(function (err) { console.warn('[Kartentausch] Aufdecken fehlgeschlagen:', err); });
    }

    // Nach dem Klopfen deckt jeder direkt nach seinem Zug auf.
    function revealAfterMoveIfNeeded(hand) {
        if (pub.knockedBySeat === null || pub.knockedBySeat === undefined) return Promise.resolve();
        return publishMyHand(hand);
    }

    function doSingleSwap() {
        if (busy || pickedHand === null || pickedMiddle === null) return;
        busy = true;
        var middle = (pub.middleCards || []).slice();
        var hand = myHand.slice();
        var given = hand[pickedHand];
        var taken = middle[pickedMiddle];
        hand[pickedHand] = taken;
        middle[pickedMiddle] = given;

        writeHand(hand)
            .then(function () { return revealAfterMoveIfNeeded(hand); })
            .then(function () { return commitTurn(middle, { type: 'single', seat: mySeat, gave: given, took: taken }); })
            .then(resetSwapMode)
            .catch(handleWriteError)
            .then(function () { busy = false; });
    }

    function doSwapAll() {
        if (busy) return;
        busy = true;
        var middle = (pub.middleCards || []).slice();
        var hand = myHand.slice();

        writeHand(middle)
            .then(function () { return revealAfterMoveIfNeeded(middle); })
            .then(function () { return commitTurn(hand, { type: 'all', seat: mySeat }); })
            .then(resetSwapMode)
            .catch(handleWriteError)
            .then(function () { busy = false; });
    }

    function doKnock() {
        if (busy) return;
        busy = true;
        // Der Klopfer deckt sofort auf - das ist der Sinn des Klopfens.
        publishMyHand()
            .then(function () { return commitTurn((pub.middleCards || []).slice(), { type: 'knock', seat: mySeat }); })
            .then(resetSwapMode)
            .catch(handleWriteError)
            .then(function () { busy = false; });
    }

    function handleWriteError(err) {
        console.warn('[Kartentausch] Zug fehlgeschlagen:', err);
        setStatus('Zug nicht angekommen', 'Netzwerkproblem — bitte nochmal antippen.', 'is-error');
    }

    function resetSwapMode() {
        pickedHand = null;
        pickedMiddle = null;
        render();
    }

    // ---------- Darstellung ----------

    function renderActions() {
        els.actions.innerHTML = '';

        if (pub.phase === 'hostSelect' && isHost) {
            var caption = document.createElement('div');
            caption.className = 'kt-count-caption';
            caption.textContent = 'Wie viele spielen mit?';
            els.actions.appendChild(caption);

            var grid = document.createElement('div');
            grid.className = 'kt-count-grid';
            [2, 3, 4, 5, 6].forEach(function (n) {
                var b = document.createElement('button');
                b.className = 'kt-count-btn';
                b.textContent = n;
                b.addEventListener('click', function () { choosePlayerCount(n); });
                grid.appendChild(b);
            });
            els.actions.appendChild(grid);
            els.actions.appendChild(button('🤖 Nur zuschauen — Computer spielt', 'kt-btn-bot', startBotRound));
            return;
        }

        if (!isMyTurn()) return;

        // Einzeltausch braucht keinen eigenen Knopf mehr: Karten sind am Zug
        // direkt antippbar, der Bestaetigen-Knopf erscheint, sobald beide
        // Karten gewaehlt sind.
        if (pickedHand !== null || pickedMiddle !== null) {
            var ready = pickedHand !== null && pickedMiddle !== null;
            els.actions.appendChild(button(ready ? 'Tausch bestätigen' : 'Karte aus der Mitte wählen…',
                'kt-btn-confirm', doSingleSwap, !ready));
            els.actions.appendChild(button('Abbrechen', 'kt-btn-ghost', resetSwapMode));
            return;
        }

        // Rundumtausch nur, wenn die Mitte ihn wert ist (Drilling oder drei
        // gleiche Farben) - sonst bleibt der Knopf weg.
        if (E.middleWorthTakingAll(pub.middleCards || [])) {
            els.actions.appendChild(button('Alle 3 tauschen', '', doSwapAll));
        }

        if (canKnockNow()) {
            els.actions.appendChild(button('Klopfen', 'kt-btn-knock', doKnock));
        }
    }

    function renderReveal() {
        els.statusExtra.innerHTML = '';
        var hands = pub.revealedHands || {};
        var scores = pub.scores || {};
        var paying = pub.payingSeats || [];
        var fireSeats = pub.fireSeats || [];

        Object.keys(hands).map(Number).sort(function (a, b) { return a - b; }).forEach(function (seat) {
            var row = document.createElement('div');
            row.className = 'kt-reveal-row' +
                (paying.indexOf(seat) !== -1 ? ' is-paying' : '') +
                (fireSeats.indexOf(seat) !== -1 ? ' is-fire' : '');

            var name = document.createElement('div');
            name.className = 'kt-reveal-name';
            name.textContent = (seat === mySeat ? 'Du' : seatName(seat)) +
                (fireSeats.indexOf(seat) !== -1 ? ' 🔥' : '');
            row.appendChild(name);

            var cards = document.createElement('div');
            cards.className = 'kt-reveal-cards';
            (hands[seat] || []).forEach(function (code) { cards.appendChild(cardImg(code)); });
            row.appendChild(cards);

            var score = document.createElement('div');
            score.className = 'kt-reveal-score';
            score.textContent = scores[seat] !== undefined ? scores[seat] : '–';
            row.appendChild(score);

            els.statusExtra.appendChild(row);
        });
    }

    function render() {
        var phase = pub.phase || 'idle';
        var count = Number(pub.playerCount) || 0;
        var seats = pub.seats || {};

        els.seatBadge.textContent = mySeat >= 0 ? seatName(mySeat) : '—';
        show(els.seatBadge, mySeat >= 0);

        var showCards = myHand.length === 3 && phase !== 'idle' && phase !== 'hostSelect';
        show(els.handPanel, showCards);
        show(els.middlePanel, (pub.middleCards || []).length === 3 && phase !== 'idle' && phase !== 'hostSelect');

        var myTurn = isMyTurn();
        renderCards(els.handCards, myHand, {
            pickable: myTurn,
            selected: pickedHand,
            onPick: function (i) { pickedHand = (pickedHand === i ? null : i); render(); }
        });
        renderCards(els.middleCards, pub.middleCards || [], {
            middle: true,
            pickable: myTurn,
            selected: pickedMiddle,
            onPick: function (i) { pickedMiddle = (pickedMiddle === i ? null : i); render(); }
        });
        renderHandScore();
        els.statusExtra.innerHTML = '';

        if (phase === 'hostSelect') {
            if (isHost) setStatus('Du bist der Host', 'Tippe die Spieleranzahl an — danach können die anderen scannen.');
            else setStatus('Runde wird gestartet…', 'Jemand anderes wählt gerade die Spieleranzahl.');

        } else if (phase === 'lobby') {
            var taken = Object.keys(seats).filter(function (k) { return seats[k] && seats[k].uid; }).length;
            setStatus(mySeat >= 0 ? 'Du bist dabei!' : 'Kein Platz mehr frei',
                mySeat >= 0 ? taken + ' von ' + count + ' Plätzen belegt. Gleich geht es los.'
                            : 'Diese Runde ist voll. Warte auf die nächste.');
            var grid = document.createElement('div');
            grid.className = 'kt-seat-grid';
            for (var i = 0; i < count; i++) {
                var pill = document.createElement('div');
                var occupied = seats[i] && seats[i].uid;
                pill.className = 'kt-seat-pill' + (occupied ? ' is-taken' : '') + (i === mySeat ? ' is-me' : '');
                pill.textContent = i === mySeat ? 'Du' : (occupied ? seatName(i) : 'frei');
                grid.appendChild(pill);
            }
            els.statusExtra.appendChild(grid);

        } else if (phase === 'playing' || phase === 'knocked') {
            var knockNote = (pub.knockedBySeat !== null && pub.knockedBySeat !== undefined)
                ? ' · ' + (Number(pub.knockedBySeat) === mySeat ? 'Du hast' : seatName(pub.knockedBySeat) + ' hat') + ' geklopft'
                : '';
            if (myTurn) {
                var hint;
                if (pickedHand !== null || pickedMiddle !== null) {
                    hint = 'Jetzt die Karte aus der Mitte antippen, dann bestätigen.';
                } else if (canKnockNow()) {
                    hint = 'Eigene Karte antippen und tauschen — oder klopfen.';
                } else {
                    var left = knockRoundsLeft();
                    hint = 'Eigene Karte antippen und tauschen. Klopfen geht erst ab der zweiten Runde' +
                           (left > 0 ? ' (noch ' + left + (left === 1 ? ' Zug' : ' Züge') + ').' : '.');
                }
                setStatus('Du bist dran!', hint + knockNote, 'is-myturn');
            } else {
                setStatus(seatName(pub.currentTurnSeat) + ' ist dran',
                    'Warte, bis du dran bist.' + knockNote);
            }
            if (Object.keys(pub.revealedHands || {}).length) renderReveal();

        } else if (phase === 'reveal') {
            var paying = pub.payingSeats || [];
            var fire = (pub.fireSeats || []).length > 0;
            var iPay = paying.indexOf(mySeat) !== -1;
            setStatus(
                fire ? '🔥 FEUER!' : (iPay ? 'Du zahlst die Runde!' : 'Aufgedeckt'),
                fire ? 'Alle unter 12 Punkten zahlen.' + (iPay ? ' Du bist dabei.' : ' Du bist raus.')
                     : (iPay ? 'Niedrigste Hand — Prost!' : 'Diesmal nicht du.'),
                iPay ? 'is-error' : '');
            renderReveal();

        } else {
            setStatus('Warte auf die nächste Runde', 'Der TV startet gleich eine neue Runde.');
        }

        renderActions();
    }

    // ---------- Ablauf ----------

    function choosePlayerCount(n) {
        if (busy) return;
        busy = true;
        KtNet.publicRef(db, sessionId).update({
            playerCount: n,
            phase: 'lobby',
            lobbyStartedAt: firebase.database.ServerValue.TIMESTAMP
        }).then(function () {
            return KtNet.claimSeat(db, sessionId, uid, n);
        }).then(function (seat) {
            mySeat = seat;
            if (seat >= 0) localStorage.setItem('kt_seat_' + sessionId, String(seat));
            watchMyHand();
        }).catch(function (err) {
            console.warn('[Kartentausch] Spieleranzahl konnte nicht gesetzt werden:', err);
        }).then(function () { busy = false; });
    }

    // Vorfuehrrunde: der TV besetzt alle Plaetze selbst und spielt sie aus.
    function startBotRound() {
        if (busy) return;
        busy = true;
        KtNet.publicRef(db, sessionId).update({
            botGame: true,
            playerCount: CFG.botPlayerCount || 3,
            phase: 'botRound',
            hostUid: null
        }).catch(function (err) {
            console.warn('[Kartentausch] Computer-Runde konnte nicht gestartet werden:', err);
        }).then(function () { busy = false; });
    }

    function tryJoin() {
        if (mySeat >= 0 || busy || pub.botGame) return;
        var count = Number(pub.playerCount) || 0;
        if (!count) return;
        busy = true;
        KtNet.claimSeat(db, sessionId, uid, count).then(function (seat) {
            mySeat = seat;
            if (seat >= 0) {
                localStorage.setItem('kt_seat_' + sessionId, String(seat));
                watchMyHand();
            }
            render();
        }).catch(function (err) {
            console.warn('[Kartentausch] Sitzplatz konnte nicht belegt werden:', err);
        }).then(function () { busy = false; });
    }

    var handWatcher = null;
    function watchMyHand() {
        if (mySeat < 0 || handWatcher) return;
        handWatcher = KtNet.privateRef(db, sessionId, mySeat);
        handWatcher.on('value', function (snap) {
            var val = snap.val();
            myHand = (val && val.hand) || [];
            render();
        }, function (err) {
            console.warn('[Kartentausch] Hand nicht lesbar:', err);
        });
    }

    // Sicherheitsnetz: wer bis zur Auswertung noch nicht aufgedeckt hat
    // (z. B. weil sein Zug uebersprungen wurde), tut es hier nach.
    var publishedReveal = false;
    function maybePublishHand() {
        if (pub.phase !== 'reveal' || publishedReveal || mySeat < 0 || myHand.length !== 3) return;
        publishedReveal = true;
        publishMyHand();
    }

    function onPublic(snap) {
        var prevPhase = pub.phase;
        pub = snap.val() || {};
        if (pub.phase !== 'reveal') publishedReveal = false;

        // Neue Runde: alter Sitzplatz gilt nicht mehr.
        if (prevPhase === 'reveal' && pub.phase === 'idle') {
            mySeat = -1;
            myHand = [];
            if (handWatcher) { handWatcher.off(); handWatcher = null; }
            localStorage.removeItem('kt_seat_' + sessionId);
        }

        if (pub.phase === 'hostSelect' && !isHost && pub.hostUid === uid) isHost = true;
        if (pub.phase === 'lobby') tryJoin();
        if (mySeat >= 0) watchMyHand();
        maybePublishHand();
        render();
    }

    function start() {
        if (!sessionId) {
            setStatus('Kein Spiel gefunden', 'Bitte den QR-Code am Fernseher noch einmal scannen.', 'is-error');
            return;
        }
        if (!KtNet.isConfigured()) {
            setStatus('Noch nicht eingerichtet', 'Die Firebase-Zugangsdaten fehlen in kartentausch-config.js.', 'is-error');
            return;
        }

        KtNet.ready().then(function (conn) {
            if (!conn) {
                setStatus('Keine Verbindung', 'Der Spielserver ist nicht erreichbar. Nochmal scannen?', 'is-error');
                return;
            }
            db = conn.db;
            uid = conn.uid;

            var stored = localStorage.getItem('kt_seat_' + sessionId);
            if (stored !== null) mySeat = Number(stored);

            return KtNet.claimHost(db, sessionId, uid).then(function (gotHost) {
                isHost = gotHost;
                if (gotHost) {
                    // Erster Scan der Runde: TV pausiert die Rotation und wartet
                    // auf die Spieleranzahl.
                    return KtNet.publicRef(db, sessionId).update({
                        phase: 'hostSelect',
                        hostRequestedAt: firebase.database.ServerValue.TIMESTAMP
                    });
                }
            }).then(function () {
                KtNet.publicRef(db, sessionId).on('value', onPublic, function (err) {
                    console.warn('[Kartentausch] Spielstand nicht lesbar:', err);
                    setStatus('Verbindung verloren', 'Bitte neu laden.', 'is-error');
                });
            });
        }).catch(function (err) {
            console.warn('[Kartentausch] Start fehlgeschlagen:', err);
            setStatus('Fehler beim Start', 'Bitte die Seite neu laden.', 'is-error');
        });
    }

    start();
})();
</script>
</body>
</html>
