# City-Cafe-Kiosk: sway direkt am Bildschirm (ersetzt cage).
# Chromium fuellt den Bildschirm als normales Fenster; mpv schwebt fuer den
# Nightlife-Slot ueber der Videoflaeche des Widgets (Position setzt der
# Supervisor). Chromium darf NICHT im sway-Vollbild stehen - Vollbild liegt
# in sway ueber schwebenden Fenstern, mpv waere dann unsichtbar.

output HDMI-A-1 mode 1920x1080@60Hz position 0 0

default_border none
default_floating_border none
hide_edge_borders both
gaps inner 0
gaps outer 0
focus_follows_mouse no
seat * hide_cursor 1000

# Im --app-Modus heisst Chromiums app_id "chrome-<seite>-Default".
for_window [app_id="^chrom"] fullscreen disable
# Videoflaeche des Nightlife-Widgets bei aktivem Slot (1200x675 auf dem
# 1920x1080-Ausgang). Der Supervisor misst beim Start nach und korrigiert.
# Erst resize, dann move: sway verkleinert schwebende Fenster um ihre Mitte -
# andersherum landete das 1920x1080 grosse mpv-Fenster bei 443/450.
for_window [app_id="mpv"] floating enable, border none, sticky enable, resize set width 1200 px height 675 px, move absolute position 83 248

# Endet Chromium (Absturz, Neustart), endet auch sway - die Schleife in
# ~/.bash_profile startet dann alles frisch, wie vorher bei cage.
exec sh -c '/usr/local/bin/citycafe-chromium; swaymsg exit'

# Nightlife-Supervisor: spielt YouTube-Slots mit mpv ueber dem Widget. Eine
# Instanz aus einer frueheren sway-Sitzung (samt ihrem mpv) wird vorher
# beendet - sie haette veraltete Wayland-/sway-Sockets.
exec sh -c 'pkill -u citycafe -f "^python3 /opt/citycafe/nl-mpv-supervisor"; pkill -u citycafe -x mpv; exec python3 /opt/citycafe/nl-mpv-supervisor.py >/dev/null 2>>/home/citycafe/nl-mpv-supervisor.err'
