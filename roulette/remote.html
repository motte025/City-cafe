<!doctype html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a1917"><title>City Cafe · Roulette-Fernbedienung</title>  <script type="module" crossorigin src="./assets/main-lQYPaFJb.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/main-DS5CKnq8.css">
<style>
/* ============================================================
   Handy-Schriften fuer die Roulette-Fernbedienung.

   Die gebaute Fassung ist fuer Tablet/Rechner gemacht: Beschriftungen
   mit 8 bis 13 px sind am Handy im Lokal nicht lesbar - dieselbe Vorgabe
   wie bei der Video- und der DJ-Fernbedienung ("lieber scrollen als
   kneifen"). Deshalb hier eine Ueberschreibung, die nur bei schmalen
   Fenstern greift; auf Tablet und Rechner bleibt alles wie entworfen.

   Bewusst als eigener Block in der Seite und nicht im Bundle: der Bau
   (roulette-src, Vite) braucht npm, das auf der Kiosk-Box nicht
   installiert ist. Derselbe Block steht auch in roulette-src/remote.html,
   damit ein spaeterer Neubau ihn behaelt.
   ============================================================ */
@media (max-width: 900px) {
    .remote-shell { padding: 22px 14px 48px; }
    .remote-heading .eyebrow { font-size: 21px; letter-spacing: 1.4px; }
    .remote-heading h1 { font-size: 54px; margin-top: 10px; }
    .remote-link-state { font-size: 21px; padding: 12px 16px; border-radius: 26px; }
    .remote-room { font-size: 23px; margin: 14px 0 24px; }

    .remote-live { padding: 24px 12px 16px; border-radius: 16px; }
    .remote-live span { font-size: 22px; margin-bottom: 10px; }
    .remote-live strong { font-size: 52px; }
    .remote-live p { font-size: 24px; margin-top: 22px; }

    .remote-page .section-label { font-size: 21px; letter-spacing: 1.4px; margin-bottom: 14px; }
    /* Zwei statt vier Spalten: mit der grossen Schrift passen vier
       Kacheln nicht mehr nebeneinander. */
    .remote-page .preset-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .remote-page .round-preset { min-height: 104px; font-size: 42px; padding: 14px 10px; }
    .remote-page .round-preset span { font-size: 21px; margin-top: 6px; letter-spacing: 0.4px; }
    .remote-page .helper { font-size: 21px; line-height: 1.45; margin: 16px 0 24px; }

    .remote-actions { gap: 12px; }
    .remote-actions button { font-size: 30px; min-height: 84px; border-radius: 14px; }
    .remote-actions .stop-button { min-height: 80px; }
    #command-feedback { height: auto; min-height: 30px; font-size: 22px; margin: 16px 0 24px; }

    .remote-settings { padding-top: 26px; }
    .remote-page .setting-field { font-size: 23px; gap: 14px; }
    .remote-page .setting-field > span { font-size: 23px; align-items: center; }
    .remote-page .setting-field output { font-size: 23px; }
    .remote-page .settings-grid { grid-template-columns: 1fr; gap: 26px; }
    .setting-field input[type=range] { min-height: 52px; }
    .setting-field input[type=number] { font-size: 24px; padding: 14px; }
    .switch { font-size: 24px; gap: 14px; }
    .switch input { width: 32px; height: 32px; }
    .picture-settings summary { font-size: 25px; }
    .picture-settings p, .audio-hint { font-size: 21px; line-height: 1.5; }

    .remote-history { gap: 10px; min-height: 60px; }
    .remote-history .history-number { width: 64px; height: 64px; font-size: 30px; border-radius: 10px; }

    .remote-footer { font-size: 20px; gap: 16px; padding-top: 22px; }

    /* Der Einstellungs-Dialog gehoert genauso dazu. */
    dialog { padding: 22px 18px; }
    .dialog-title h2 { font-size: 34px; }
    .dialog-title button { font-size: 26px; padding: 10px 16px; }
    dialog p, dialog label, dialog .setting-field { font-size: 22px; }
}
</style>
</head><body><div id="app"></div></body></html>
