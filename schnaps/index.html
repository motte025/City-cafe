  /* Feier-Funken aus der Flachwitz-Animation (grafik/witz/witz-funken.webp) */

  /* 1) Spannung: Walzen, die noch laufen, wenn vorne schon 2 gleich sind */

  .lampe { width: 18px; height: 18px; margin: -9px 0 0 -9px; }

  .barlicht { position: absolute; z-index: 1; pointer-events: none; overflow: hidden; }

  @keyframes steigen { 0% { transform: translateY(0) scale(.8); opacity: 0; } 15% { opacity: var(--o); } 85% { opacity: var(--o); } 100% { transform: translateY(-420px) scale(1.15); opacity: 0; } }

<script>
// ---------------- Daten ----------------
const SYMBOLE = [

      if (art === 'wegVier' && i === N - 1) { const ok = []; for (let k = 0; k < L; k++) { const d = ((jI - k) % L + L) % L; if (d >= 2 && d <= L - 2) ok.push(k); } m = zufallAus(ok); }   // letzte Walze: Getraenk erst nicht im Bild
      else m = ((jI - wegOffs[i]) % L + L) % L;
      mitten[i] = m; reihe[i] = W.ordnung[m]; });
  }
  const extra = art === 'vier' || art === 'wegVier';
  const weg = extra ? null : wegSuchen(mitten);
  // tatsaechliche Mittelreihe auswerten (Laeufe gleicher Getraenke von links nach rechts)
  gruppen = auswerten(walzen.map((W, i) => W.ordnung[mitten[i]]));
  const hd = $('hand'), M = AUTOMATEN[wahl].m;
  anzeige('MÜNZE REIN – HEBEL ZIEHEN!', 'leise');
  // 1) Hand bringt die Muenze
  hd.className = ''; hd.style.transition = 'none'; hd.style.transform = 'translate(900px, 900px) rotate(8deg)'; void hd.offsetWidth;
  hd.style.transition = 'transform 1.1s cubic-bezier(.2,.8,.25,1)';
  spaeter(() => { hd.style.transform = 'translate(0, -6px) rotate(0deg)'; }, 300);
  spaeter(() => { hd.style.transition = 'transform .25s ease-in'; hd.style.transform = 'translate(-4px, 14px) rotate(-1deg)'; }, 1450);
  spaeter(() => {
    // Muenze faellt in den Schlitz
    hd.classList.add('ohne-muenze');
    const m = document.createElement('img'); m.className = 'muenze rein'; m.src = 'muenze.webp';
    const g = Math.round(92 * 1100 / 1100); Object.assign(m.style, { width: g + 'px', left: (M.muenzschlitz[0] - g / 2) + 'px', top: (M.muenzschlitz[1] - g / 2 + 8) + 'px' });
    $('buehne').appendChild(m); setTimeout(() => m.remove(), 700);
    const b = $('blitz'); b.classList.remove('an'); void b.offsetWidth; b.classList.add('an');
    anzeige('★ 1 CREDIT ★', '');
  }, 1700);
  spaeter(() => { hd.style.transition = 'transform .9s cubic-bezier(.5,0,.8,.4)'; hd.style.transform = 'translate(950px, 950px) rotate(10deg)'; }, 2000);
  // 2) Hebel
  spaeter(() => { hebelZiehen(); document.body.classList.add('zieht'); anzeige('VIEL GLÜCK!', ''); }, 2700);
  // 3) Walzen drehen, eine nach der anderen stoppen
  const START = 3050;
  // Spannung: sind die ersten drei gleich, laufen die restlichen Walzen deutlich laenger und leuchten
  const spannung = (reihe[0] === reihe[1] && reihe[1] === reihe[2]) || !!weg || art === 'wegVier';
  const dauern = walzen.map((W, i) => 3700 + i * 480 + (spannung && i >= 3 ? 1500 + (i - 3) * 1100 : 0));
  walzen.forEach((W, i) => spaeter(() => drehen(W, mitten[i], dauern[i]), START));
  if (spannung) spaeter(() => { walzen.forEach((W, i) => { if (i >= 3) W.el.classList.add('spannung'); }); anzeige('★ SPANNUNG! ★', 'spannung'); }, START + dauern[2] + 80);
  const ende = START + Math.max(...dauern) + 250;
  if (extra) {
    const treffer = Math.random() < 0.5, Wl = walzen[N - 1], L = Wl.ordnung.length;
    let zielIdx;
    if (art === 'wegVier') {   // Treffer: Getraenk landet an einem Nachbarfeld der vierten Walze; sonst knapp daneben
      const jI = Wl.ordnung.indexOf(J), pass = [-1, 0, 1].filter(o => Math.abs(o - wegOffs[N - 2]) <= 1);
      if (treffer) zielIdx = ((jI - zufallAus(pass)) % L + L) % L;
      else { const ok = []; for (let k = 0; k < L; k++) { const d = ((jI - k) % L + L) % L, off = d > L / 2 ? d - L : d; if (!pass.includes(off)) ok.push(k); } zielIdx = zufallAus(ok); }
    } else zielIdx = Wl.ordnung.indexOf(treffer ? A : zufallAus(SYMBOLE.filter(x => x !== A)));
    const EXTRA = 1900, DAUER2 = 4300;
    spaeter(() => extraDreh(), ende);
    spaeter(() => { Wl.el.classList.add('spannung'); drehen(Wl, zielIdx, DAUER2); }, ende + EXTRA);
    spaeter(() => { walzen.forEach(W => W.el.classList.remove('gehalten')); document.querySelectorAll('.halteschild').forEach(x => x.remove()); const w2 = wegSuchen(walzen.map(W => W.pos)), g2 = auswerten(walzen.map(W => W.ordnung[W.pos])); Wl.el.classList.remove('spannung');
      if (w2) jackpot(w2); else if (g2.length) gewinnen(g2); else anzeige('★ KNAPP DANEBEN! ★', 'spannung'); }, ende + EXTRA + DAUER2 + 250);
    spaeter(spielen, ende + EXTRA + DAUER2 + 250 + 11000);
  } else {
    spaeter(() => weg ? jackpot(weg) : gewinnen(gruppen), ende);
    spaeter(spielen, ende + 11000);
  }
}

// Hebel: Bildfolge oben -> halb -> unten -> halb -> oben
function hebelStellung(n) { [1, 2, 3].forEach(k => $('hebel' + k).classList.toggle('an', k === n)); }
function hebelZiehen() {
  [[0, 2], [110, 3], [700, 2], [820, 1]].forEach(([t, n]) => setTimeout(() => hebelStellung(n), t));
}

// Walze dreht nach unten: neue Getraenke kommen von oben (Index sinkt). Jedes Getraenk steht nur einmal auf der Walze.
function drehen(W, zielIndex, dauer) {
  const L = W.ordnung.length, runden = 2 + Math.floor(dauer / 900);
  const k = ((W.pos - zielIndex) % L + L) % L + runden * L;          // Schritte bis zum Ziel
  const liste = []; for (let j = 0; j <= k + 2; j++) liste.push(ring(W, zielIndex - 1 + j));
  W.band.innerHTML = zellen(liste, W.fh);
  const mitte = (W.h - W.fh) / 2, von = mitte - (k + 1) * W.fh, bis = mitte - 1 * W.fh;
  W.band.style.transition = 'none'; W.band.style.transform = `translateY(${Math.round(von)}px)`; void W.band.offsetWidth;
  W.band.classList.add('dreht');
  W.band.style.transition = `transform ${dauer}ms cubic-bezier(.18,.55,.22,1.04)`;
  W.band.style.transform = `translateY(${Math.round(bis)}px)`;
  setTimeout(() => W.band.classList.remove('dreht'), dauer * .72);
  setTimeout(() => { W.pos = zielIndex; zeichnen(W); einrasten(W); }, dauer + 30);
}

// 6) Einrasten: mittleres Feld blitzt kurz, ein paar Funken springen, Spannungs-Leuchten aus
// Extra-Dreh: grosses Schild, die ersten Walzen werden golden gehalten
function extraDreh() {
  const e = $('extraSchild'); e.classList.remove('an'); void e.offsetWidth; e.classList.add('an');
  anzeige('★ EXTRA DREH! ★', 'spannung');
  walzen.forEach((W, i) => { if (i < walzen.length - 1) spaeter(() => { W.el.classList.add('gehalten');
    const h = document.createElement('div'); h.className = 'halteschild'; h.textContent = 'GEHALTEN';
    Object.assign(h.style, { left: (W.el.offsetLeft + W.el.offsetWidth / 2) + 'px', top: (W.el.offsetTop + W.h - 58) + 'px' }); $('buehne').appendChild(h); }, 500 + i * 160); });
}
function einrasten(W) {
  W.el.classList.remove('spannung');
  let b = W.el.querySelector('.rastblitz'); if (!b) { b = document.createElement('div'); b.className = 'rastblitz'; W.el.appendChild(b); }
  Object.assign(b.style, { top: Math.round((W.h - W.fh) / 2) + 'px', height: W.fh + 'px' }); b.classList.remove('an'); void b.offsetWidth; b.classList.add('an');
  const x0 = W.el.offsetLeft + W.el.offsetWidth / 2, y0 = W.el.offsetTop + W.h / 2;
  for (let k = 0; k < 8; k++) { const fu = document.createElement('div'); fu.className = 'rastfunke'; const w = zufall(0, Math.PI * 2), d = zufall(50, 120);
    Object.assign(fu.style, { left: (x0 + Math.cos(w) * W.el.offsetWidth * .3) + 'px', top: (y0 + Math.sin(w) * W.fh * .45) + 'px' });
    fu.style.setProperty('--fx', (Math.cos(w) * d).toFixed(0) + 'px'); fu.style.setProperty('--fy', (Math.sin(w) * d).toFixed(0) + 'px');
    $('buehne').appendChild(fu); setTimeout(() => fu.remove(), 700); }
}

// 2) Preis zaehlt hoch (0,00 -> Zielpreis) in allen Elementen mit data-preis
function hochzaehlen(nach, ms) {
  spaeter(() => { const els = [...document.querySelectorAll('[data-preis]')], t0 = performance.now();
    const schritt = t => { const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 3);
      els.forEach(el => { el.textContent = euro(+el.dataset.preis * e); }); if (p < 1) requestAnimationFrame(schritt); };
    els.forEach(el => { el.textContent = euro(0); }); requestAnimationFrame(schritt); }, nach);
}

function feiern(nach, spiegeln) {
  spaeter(() => {
    const f = document.createElement('div'); f.className = 'funken' + (spiegeln ? ' gespiegelt' : '');
    $('buehne').appendChild(f); requestAnimationFrame(() => f.classList.add('an')); setTimeout(() => f.remove(), 2800);
  }, nach);
}

function auswerten(reihe) {
  const laeufe = []; let a = 0;
  for (let i = 1; i <= reihe.length; i++) if (i === reihe.length || reihe[i] !== reihe[a]) { laeufe.push({ sym: reihe[a], n: i - a, start: a }); a = i; }
  const treffer = laeufe.filter(l => l.n >= 2);
  return (treffer.some(l => l.n >= 3) || treffer.length >= 2) ? treffer : treffer.slice(0, 1);
}

// Sucht Jaegermeister / Ane aufs Aug auf jeder Walze (oben, Mitte oder unten); offs = -1/0/+1 je Walze
function wegSuchen(mitten) {
  for (const id of ['jaeger', 'aug']) {
    const J = SYMBOLE.find(x => x.id === id), offs = walzen.map((W, i) => [0, -1, 1].find(o => ring(W, mitten[i] + o) === J));
    if (offs.every(o => o !== undefined) && offs.every((o, i) => i === 0 || Math.abs(o - offs[i - 1]) <= 1)) return { sym: J, offs };
  }
  return null;
}
// JACKPOT: Linie verbindet die Getraenke ueber alle Walzen, Flascherl fliegt ein, Feier
function jackpot(weg) {
  const N = walzen.length, J = weg.sym, preis = J.angebot ? J.angebot.preis : J.preis * N, text = `${N} × ${J.name.toUpperCase()}`;
  document.body.classList.add('gewinn');
  walzen.forEach((W, i) => { const fe = W.band.querySelectorAll('.feld')[1 + weg.offs[i]]; if (fe) fe.classList.add('gewinn'); });
  const pkt = walzen.map((W, i) => [Math.round(W.el.offsetLeft + W.el.offsetWidth / 2), Math.round(W.el.offsetTop + W.h / 2 + weg.offs[i] * W.fh)]);
  const W0 = walzen[0].el, Wn = walzen[N - 1].el;
  const linie = [[W0.offsetLeft - 14, pkt[0][1]], ...pkt, [Wn.offsetLeft + Wn.offsetWidth + 14, pkt[N - 1][1]]].map(p => p.join(',')).join(' ');
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); svg.id = 'jackpotWeg'; svg.setAttribute('viewBox', '0 0 1920 1080');
  svg.innerHTML = `<polyline class="schein" pathLength="1" points="${linie}"/><polyline class="kern" pathLength="1" points="${linie}"/>` + pkt.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="9"/>`).join('');
  $('buehne').appendChild(svg); requestAnimationFrame(() => requestAnimationFrame(() => svg.classList.add('an')));
  anzeige(`★ JACKPOT ★ &nbsp;${text} &nbsp;·&nbsp; <em data-preis="${preis}">${euro(0)}</em>`, 'gewinn');
  $('bannerKlein').textContent = J.angebot ? '★ JACKPOT · ANGEBOT ★' : '★ JACKPOT ★';
  $('bannerText').innerHTML = `${text}<br><em data-preis="${preis}">${euro(0)}</em>`;
  hochzaehlen(3000, 1300);
  $('jaegerAuftritt').src = J.id === 'jaeger' ? 'jaegermeister-flascherl.webp' : J.bild;
  for (const id of ['jaegerAuftritt', 'jaegerStrahl']) { const e = $(id); e.classList.remove('an'); void e.offsetWidth; e.classList.add('an'); }
  const b = $('banner'); b.classList.remove('an'); void b.offsetWidth; b.style.animationDelay = '3s, 9.2s'; b.classList.add('an');
  feiern(0); feiern(1300, true);
  spaeter(() => { document.body.classList.remove('gewinn'); const x = $('jackpotWeg'); if (x) x.remove(); }, 9800);
}
function gewinnen(gruppen) {
  const N = walzen.length, gs = gruppen.map(gr => gewinnText(gr.sym, gr.n)), drin = new Set(); gruppen.forEach(gr => { for (let k = 0; k < gr.n; k++) drin.add(gr.start + k); });
  document.body.classList.add('gewinn');
  walzen.forEach((W, i) => { if (!drin.has(i)) return; const f = W.band.querySelectorAll('.feld')[1]; if (f) f.classList.add('gewinn'); });
  // Gewinnlinie nur ueber die getroffenen Walzen
  // je Gewinn-Gruppe ein eigenes Linienstueck; zwischen zwei Gruppen eine Luecke
  document.querySelectorAll('.linie.stueck').forEach(x => x.remove());
  { gruppen.forEach((gr, k) => { const start = gr.start;
      const a = walzen[start].el, e = walzen[start + gr.n - 1].el, l = $('linie').cloneNode(); l.removeAttribute('id'); l.classList.add('stueck');
      const links = a.offsetLeft - (k === 0 ? 12 : -10), rechts = e.offsetLeft + e.offsetWidth + (k === gruppen.length - 1 ? 12 : -10);
      l.style.left = links + 'px'; l.style.width = (rechts - links) + 'px'; $('buehne').appendChild(l); requestAnimationFrame(() => l.classList.add('an'));
    }); }
  anzeige(gs.map(g => `${g.text} &nbsp;·&nbsp; <em data-preis="${g.preis}">${euro(0)}</em>`).join(' &nbsp;+&nbsp; '), 'gewinn');
  $('bannerKlein').textContent = gs[0].angebot ? '★ JACKPOT · ANGEBOT ★' : '★ PREIS ★';
  $('bannerText').innerHTML = gs.length > 1 ? gs.map(g => `${g.text} · <em data-preis="${g.preis}">${euro(0)}</em>`).join('<br>') : `${gs[0].text}<br><em data-preis="${gs[0].preis}">${euro(0)}</em>`;
  hochzaehlen(gs[0].angebot ? 3000 : 900, 1300);
  // 5) Jaegermeister-Angebot: grosses, eiskaltes Flascherl fliegt nach vorne
  if (gs[0].angebot) { $('jaegerAuftritt').src = 'jaegermeister-flascherl.webp'; for (const id of ['jaegerAuftritt', 'jaegerStrahl']) { const e = $(id); e.classList.remove('an'); void e.offsetWidth; e.classList.add('an'); } }
  const b = $('banner'); b.classList.remove('an'); void b.offsetWidth; b.style.animationDelay = gs[0].angebot ? '3s, 9.2s' : ''; b.classList.add('an');
  // Feier wie beim Flachwitz (Sterne, Konfetti, Luftschlangen) - nur bei kompletter Reihe, zweimal
  if (gruppen[0].n === N) { feiern(0); feiern(1300, true); }
  spaeter(() => { document.body.classList.remove('gewinn'); document.querySelectorAll('.linie.stueck').forEach(x => x.remove()); }, 9800);
}

  .map(([k, t]) => `<button data-w="${k}">${t}</button>`).join('');
