<svg xmlns="http://www.w3.org/2000/svg" viewBox="-90 -90 180 180" width="512" height="512" role="img" aria-label="Cooler Smiley mit Sonnenbrille und voller Zahnreihe" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Cooler Smiley</title>
<defs>
<clipPath id="scLens"><path d="M-70,-40 L-8,-32 L-10,-2 Q-12,12 -34,12 Q-60,12 -64,-6 Z"/><path d="M70,-40 L8,-32 L10,-2 Q12,12 34,12 Q60,12 64,-6 Z"/></clipPath>
<clipPath id="scMouth"><path d="M-50,18 Q0,12 50,18 Q54,52 0,68 Q-54,52 -50,18 Z"/></clipPath>
</defs>
<style>
.sc-tilt{animation:scTilt 3.8s ease-in-out infinite}
.sc-shine{animation:scShine 3.8s ease-in-out infinite}
.sc-glint{animation:scGlint 3.8s ease-in-out infinite}
.sc-sweep{animation:scSweep 4.6s ease-in-out infinite}
.sc-spark{animation:scSpark 4.2s ease-in-out infinite}
.sc-tilt,.sc-shine,.sc-glint,.sc-sweep,.sc-spark{transform-box:fill-box;transform-origin:center}
.sc-p1{animation-delay:1.4s}
.sc-p2{animation-delay:2.8s}
@keyframes scTilt{0%,100%{transform:rotate(-2.5deg) translateY(0)}50%{transform:rotate(2.5deg) translateY(-3px)}}
@keyframes scShine{0%{transform:translateX(-10px) skewX(-18deg);opacity:0}12%{opacity:.55}42%,100%{transform:translateX(190px) skewX(-18deg);opacity:0}}
@keyframes scGlint{0%,62%,100%{transform:scale(.2);opacity:0}72%{transform:scale(1);opacity:.95}84%{transform:scale(.5);opacity:.3}}
@keyframes scSweep{0%{transform:translateX(-14px) skewX(-16deg);opacity:0}10%{opacity:.7}40%,100%{transform:translateX(150px) skewX(-16deg);opacity:0}}
@keyframes scSpark{0%,72%,100%{transform:scale(.15);opacity:0}80%{transform:scale(1);opacity:1}90%{transform:scale(.45);opacity:.3}}
@media (prefers-reduced-motion: reduce){.sc-tilt,.sc-shine,.sc-glint,.sc-sweep,.sc-spark{animation:none}}
</style>
<g class="sc-tilt">
<circle r="78" fill="#E88C00"/>
<circle cx="-2" cy="-4" r="74" fill="#FFB80A"/>
<circle cx="-3" cy="-9" r="68" fill="#FFC90D"/>
<ellipse cx="-8" cy="-20" rx="58" ry="52" fill="#FFD92B"/>
<ellipse cx="-14" cy="-34" rx="44" ry="30" fill="#FFE86A" opacity=".8"/>
<ellipse cx="-34" cy="-46" rx="16" ry="9" fill="#FFFFFF" opacity=".85" transform="rotate(-32 -34 -46)"/>
<circle cx="-10" cy="-56" r="5" fill="#FFFFFF" opacity=".5"/>
<path d="M-56,-50 Q-38,-60 -18,-52" stroke="#8A5200" stroke-width="8" stroke-linecap="round" fill="none"/>
<path d="M18,-58 Q38,-66 56,-52" stroke="#8A5200" stroke-width="8" stroke-linecap="round" fill="none"/>
<path d="M-50,18 Q0,12 50,18 Q54,52 0,68 Q-54,52 -50,18 Z" fill="#B85C3A" stroke="#EE9210" stroke-width="5"/>
<g clip-path="url(#scMouth)">
<rect x="-56" y="14" width="112" height="30" fill="#FDFBF5"/>
<rect x="-56" y="47" width="112" height="28" fill="#F5EFE2"/>
<rect x="-56" y="44" width="112" height="3.5" fill="#A98B6B"/>
<path d="M-36,14 V44 M-18,14 V44 M0,14 V44 M18,14 V44 M36,14 V44 M-27,47 V75 M-9,47 V75 M9,47 V75 M27,47 V75" stroke="#C3B39A" stroke-width="2"/>
<ellipse cx="-48" cy="30" rx="10" ry="18" fill="#7A3A22" opacity=".3"/>
<ellipse cx="48" cy="30" rx="10" ry="18" fill="#7A3A22" opacity=".3"/>
<ellipse cx="-14" cy="22" rx="30" ry="5" fill="#FFFFFF" opacity=".85"/>
<rect class="sc-sweep" x="-66" y="12" width="20" height="64" fill="#FFFFFF" opacity="0"/>
<path class="sc-spark" d="M-28,22 L-25.5,27.5 L-20,30 L-25.5,32.5 L-28,38 L-30.5,32.5 L-36,30 L-30.5,27.5 Z" fill="#FFFFFF" opacity="0"/>
<path class="sc-spark sc-p1" d="M14,20 L16.5,25.5 L22,28 L16.5,30.5 L14,36 L11.5,30.5 L6,28 L11.5,25.5 Z" fill="#FFFFFF" opacity="0"/>
<path class="sc-spark sc-p2" d="M-6,54 L-3.5,59.5 L2,62 L-3.5,64.5 L-6,70 L-8.5,64.5 L-14,62 L-8.5,59.5 Z" fill="#FFFFFF" opacity="0"/>
</g>
<rect x="-11" y="-34" width="22" height="8" rx="4" fill="#12141C"/>
<path d="M-70,-40 L-8,-32 L-10,-2 Q-12,12 -34,12 Q-60,12 -64,-6 Z" fill="#12141C" stroke="#2B303D" stroke-width="3"/>
<path d="M70,-40 L8,-32 L10,-2 Q12,12 34,12 Q60,12 64,-6 Z" fill="#12141C" stroke="#2B303D" stroke-width="3"/>
<path d="M-62,-33 L-16,-26 M62,-33 L16,-26" stroke="#39404F" stroke-width="4" stroke-linecap="round" fill="none"/>
<g clip-path="url(#scLens)"><rect class="sc-shine" x="-92" y="-52" width="18" height="74" fill="#FFFFFF" opacity="0"/></g>
<path class="sc-glint" d="M-56,-38 L-53,-31 L-46,-28 L-53,-25 L-56,-18 L-59,-25 L-66,-28 L-59,-31 Z" fill="#FFFFFF" opacity="0"/>
</g>
</svg>
