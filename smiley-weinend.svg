<svg xmlns="http://www.w3.org/2000/svg" viewBox="-90 -90 180 180" width="512" height="512" role="img" aria-label="Weinender Smiley mit offenem Mund und Tränen" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Weinender Smiley</title>
<defs>
<clipPath id="swMouth"><path d="M-20,20 Q0,14 20,20 Q42,40 36,60 Q0,72 -36,60 Q-42,40 -20,20 Z"/></clipPath>
</defs>
<style>
.sw-bob{animation:swBob 1.8s ease-in-out infinite}
.sw-tear{animation:swTear 1.9s ease-in infinite}
.sw-bob,.sw-tear{transform-box:fill-box;transform-origin:center}
.sw-d1{animation-delay:.62s}
.sw-d2{animation-delay:.3s}
.sw-d3{animation-delay:.95s}
@keyframes swBob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(4px) rotate(-2deg)}}
@keyframes swTear{0%{transform:translateY(-2px) scale(.4);opacity:0}18%{transform:translateY(4px) scale(1);opacity:1}100%{transform:translateY(66px) scale(.85);opacity:0}}
@media (prefers-reduced-motion: reduce){.sw-bob{animation:none}.sw-tear{animation:none;opacity:1;transform:translateY(6px)}}
</style>
<g class="sw-bob">
<circle r="78" fill="#E88C00"/>
<circle cx="-2" cy="-4" r="74" fill="#FFB80A"/>
<circle cx="-3" cy="-9" r="68" fill="#FFC90D"/>
<ellipse cx="-8" cy="-20" rx="58" ry="52" fill="#FFD92B"/>
<ellipse cx="-14" cy="-34" rx="44" ry="30" fill="#FFE86A" opacity=".8"/>
<ellipse cx="-34" cy="-46" rx="16" ry="9" fill="#FFFFFF" opacity=".85" transform="rotate(-32 -34 -46)"/>
<circle cx="-10" cy="-56" r="5" fill="#FFFFFF" opacity=".5"/>
<path d="M-54,-28 Q-38,-44 -16,-42" stroke="#8A5200" stroke-width="7" stroke-linecap="round" fill="none"/>
<path d="M54,-28 Q38,-44 16,-42" stroke="#8A5200" stroke-width="7" stroke-linecap="round" fill="none"/>
<path d="M-44,-6 Q-27,-24 -10,-6" stroke="#5C3A00" stroke-width="8" stroke-linecap="round" fill="none"/>
<path d="M44,-6 Q27,-24 10,-6" stroke="#5C3A00" stroke-width="8" stroke-linecap="round" fill="none"/>
<path d="M-20,20 Q0,14 20,20 Q42,40 36,60 Q0,72 -36,60 Q-42,40 -20,20 Z" fill="#8A2E22"/>
<g clip-path="url(#swMouth)">
<rect x="-26" y="15" width="52" height="15" rx="3" fill="#FDFBF5"/>
<path d="M-13,15 V30 M0,15 V30 M13,15 V30" stroke="#C3B39A" stroke-width="2"/>
<ellipse cx="0" cy="60" rx="23" ry="12" fill="#E8515F"/>
<ellipse cx="-6" cy="21" rx="14" ry="3.5" fill="#FFFFFF" opacity=".8"/>
</g>
<path d="M-21,22 Q-33,20 -40,28" stroke="#8A5200" stroke-width="5" stroke-linecap="round" fill="none"/>
<path d="M21,22 Q33,20 40,28" stroke="#8A5200" stroke-width="5" stroke-linecap="round" fill="none"/>
<g transform="translate(-29,2)"><path class="sw-tear" d="M0,-18 C7,-5 11,2 11,9 A11,11 0 0 1 -11,9 C-11,2 -7,-5 0,-18 Z" fill="#3FA9F5"/></g>
<g transform="translate(-29,2)"><path class="sw-tear sw-d1" d="M0,-18 C7,-5 11,2 11,9 A11,11 0 0 1 -11,9 C-11,2 -7,-5 0,-18 Z" fill="#3FA9F5"/></g>
<g transform="translate(29,2)"><path class="sw-tear sw-d2" d="M0,-18 C7,-5 11,2 11,9 A11,11 0 0 1 -11,9 C-11,2 -7,-5 0,-18 Z" fill="#3FA9F5"/></g>
<g transform="translate(29,2)"><path class="sw-tear sw-d3" d="M0,-18 C7,-5 11,2 11,9 A11,11 0 0 1 -11,9 C-11,2 -7,-5 0,-18 Z" fill="#3FA9F5"/></g>
</g>
</svg>
